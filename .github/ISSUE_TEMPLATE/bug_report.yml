name: Bug report
description: Report an installation, thumbnail, or build problem without sharing private models.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Please describe the issue in text. Do not upload ZTL/ZPR models, recovery files, raw logs, or screenshots of private artwork. Remove personal paths, usernames, and project or customer names. Use a generic filename such as `sample.ztl`.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Install or uninstall
        - Thumbnail display or refresh
        - Build or synthetic tests
        - Other
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Include only product versions and architecture, not usernames or full paths.
      placeholder: |
        Package version:
        Windows version/build and architecture:
        ZBrush version, if relevant:
        File extension, if relevant: .ztl or .zpr
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the steps using generic filenames. Do not attach or resave a working model for this report.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
      placeholder: |
        Expected:
        Actual:
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error code or sanitized message (optional)
      description: Copy only the relevant short message or HRESULT. Do not paste raw logs, registration backups, full paths, or personal information.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not attached private models, recovery files, raw logs, or private artwork, and I have removed personal paths and project names from this report.
          required: true
